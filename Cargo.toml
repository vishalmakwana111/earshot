[package]
name = "earshot"
version = "0.1.0"
edition = "2021"
description = "A streaming audio source tool: any URI to an Ogg stream on stdout, with precise --start-ms splicing"
license = "MIT"
repository = "https://github.com/vishalmakwana111/earshot"
readme = "README.md"
keywords = ["ogg", "audio", "streaming", "splice", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

# M0 — the byte core — has no dependencies, on purpose.
#
# "Every layer is testable over bytes" has to be true of the build too: a CRC
# test that first compiles librespot, tokio and a TLS stack is a test nobody
# runs in a tight loop. Dependencies arrive with the milestone that needs them,
# which per DESIGN.md is:
#
#   M1 (sources + pipeline) : ureq (ranged GETs, no tokio; reqwest/tokio skipped)
#   M2 (room:// backend)    : aes, ctr, serde, serde_json, url  (+ ureq, via `http`)
#
# Note on M2 vs the original plan: `librespot-core`/`librespot-audio` turned out
# to be unnecessary for the guest. Resolution is pure HTTP against the room
# host, and the cipher is AES-128-CTR with a fixed IV (DESIGN A8) — the aes+ctr
# crates reproduce librespot's `AudioDecrypt` in thirty lines, offset-addressed
# instead of `io::Read`. The host's librespot dependency is an M3 concern.
[dependencies]
# Only the `http` feature pulls this. `ureq` rather than `reqwest` because
# earshot is entirely synchronous — the whole design is "block on a full pipe" —
# and reqwest's blocking API carries a tokio runtime purely to offer blocking
# calls. The requests here are ranged GETs with two headers.
ureq = { version = "3.3.0", optional = true }

# M2 — the room:// backend. All optional behind the `room` feature (which
# implies `http`).
aes = { version = "0.8", optional = true }
ctr = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# `url` is already in the tree via ureq; a direct dependency is what lets the
# room client parse host URLs with a battle-tested parser at the trust boundary.
url = { version = "2", optional = true }

[dev-dependencies]
# Only used by tests to *encrypt* fake fixtures the room client then decrypts.
aes = "0.8"
ctr = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["http", "room"]
# The byte core stays dependency-free: `--no-default-features` builds and tests
# `ogg`, `codec` and `splice` with an empty dependency tree, which is what keeps
# them testable over bytes with no network. CI asserts exactly that.
http = ["dep:ureq"]
# The room:// backend — a strict protocol client plus the AES-CTR + window
# decorators. Implies `http`: the room client talks HTTP.
room = ["dep:aes", "dep:ctr", "dep:serde", "dep:serde_json", "dep:url", "http"]
