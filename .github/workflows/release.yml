name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  # Lets you rehearse the whole matrix without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per target, each on a runner of that architecture. earshot has no
  # dependencies, so nothing here needs a cross toolchain, a sysroot, or system
  # headers — which is why this is a matrix of native runners rather than a
  # cross-compilation setup.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Smoke-test the artifact we are about to publish. A binary that cannot
      # answer --version is not worth shipping, and this catches a broken
      # cross-target build before a user does.
      - name: Smoke test the built binary (unix)
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/earshot
          "$bin" --version
          "$bin" pages tests/fixtures/vorbis_5s.ogg | tail -3

      - name: Smoke test the built binary (windows)
        if: runner.os == 'Windows'
        run: |
          $bin = "target/${{ matrix.target }}/release/earshot.exe"
          & $bin --version
          & $bin pages tests/fixtures/vorbis_5s.ogg | Select-Object -Last 3

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name=earshot-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/earshot "dist/$name/"
          cp README.md DESIGN.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name=earshot-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/earshot.exe "dist/$name/"
          cp README.md DESIGN.md LICENSE "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: earshot-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect artifacts and build one checksum file
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          # The installer is published as a release asset so the documented
          # `curl .../releases/latest/download/earshot-installer.sh` URL resolves.
          cp install.sh dist/earshot-installer.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        # A manual dispatch builds and smoke-tests everything but publishes
        # nothing, so the matrix can be rehearsed on a branch.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
